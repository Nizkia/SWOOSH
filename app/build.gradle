plugins {
    id 'com.android.application' // Specify the plugin for Android apps
    id 'com.google.gms.google-services' // Apply the Google Services plugin
}

android {
    namespace 'com.example.swooshv2'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.swooshv2"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Firebase BoM (Manages Firebase library versions)
    implementation platform('com.google.firebase:firebase-bom:32.0.0')


    // Firebase libraries (version managed by BoM)
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage:20.2.1'


    // Google Play Services (for Maps and Location)
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // JSON parsing and HTTP libraries
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.maps.android:android-maps-utils:2.2.5'





    // AndroidX libraries
    implementation 'androidx.cardview:cardview:1.0.0' // For CardView
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Testing libraries
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
